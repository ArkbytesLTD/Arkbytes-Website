<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Arkbytes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --water: #38bdf8;
      --water-dim: #0ea5e9;
      --ink: #060d14;
      --text: #cce9f7;
      --muted: #5b8ba8;
      --white: #f0faff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .big404 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(7rem, 22vw, 14rem);
      line-height: 1;
      letter-spacing: -0.06em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(56,189,248,0.25);
      position: relative;
      user-select: none;
    }

    .big404::after {
      content: '404';
      position: absolute;
      inset: 0;
      color: transparent;
      -webkit-text-stroke: 0;
      background: linear-gradient(135deg, rgba(56,189,248,0.08), transparent 60%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .orb {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    }

    .label {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--water);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--white);
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
      font-size: 0.88rem;
      max-width: 380px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.6rem;
      border-radius: 3px;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--water);
      color: var(--ink);
      border: 2px solid var(--water);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--water);
    }

    .btn-ghost {
      background: transparent;
      color: var(--water);
      border: 2px solid rgba(56,189,248,0.28);
    }

    .btn-ghost:hover {
      border-color: var(--water);
      background: rgba(56,189,248,0.06);
    }

    footer-note {
      display: block;
      margin-top: 3rem;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(91,139,168,0.4);
    }
  </style>
</head>
<body>

  <div class="orb"></div>

  <div class="page">
    <div class="big404">404</div>
    <p class="label">// Page not found</p>
    <h1>Lost in the void.</h1>
    <p>The page you're looking for doesn't exist, was moved, or is still being built. Let's get you back on track.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">← Back home</a>
      <a href="mailto:arkbytes.ltd@zohomail.eu" class="btn btn-ghost">Contact us</a>
    </div>

    <footer-note>Arkbytes © <span id="yr"></span></footer-note>
  </div>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
